# nginx config for the LOCAL FULL-STACK environments (infra/docker-compose.full.yml,
# the raike-test-* / raike-uat-* stacks). NOT used by Cloud Run — production keeps
# nginx.conf.
#
# WHY THIS FILE EXISTS (999.5098 / 999.5099)
# The test/UAT images were built from the PRODUCTION nginx.conf, which proxies
# /api/, /oauth/, /internal/ and /.well-known/ to the live Cloud Run backend.
# Nothing in the image pointed at the in-cluster backend, so test traffic stayed
# off production only because infra/Caddyfile intercepts those prefixes first —
# the Caddy matchers were the sole barrier between this stack and the production
# database. That barrier is one matcher edit away from failing, and it did:
# narrowing RO's @oauth matcher sent /oauth/* straight to production Cloud Run.
#
# So this config PROXIES NOTHING. Caddy owns all API routing in these stacks. A
# request that reaches nginx and is not a static file or an SPA route now 404s
# locally and loudly instead of silently succeeding against production.
#
# The Cloud Run raw-URL 301 to the production domain is omitted for the same
# reason: it is another path from a test container out to production.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/health/live { return 200 'ok'; add_header Content-Type text/plain; }
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
